[workspace]
members = [".", "crates/cinnabar-wasm"]

[package]
name = "cinnabar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
default-run = "cinnabar"

[lib]
name = "cinnabar"
path = "src/lib.rs"

[[bin]]
name = "cinnabar"
path = "src/main.rs"

[[bin]]
name = "cinnabar-lsp"
path = "src/bin/cinnabar_lsp.rs"

[features]
default = ["codegen"]
# The LLVM-backed code generator. On by default so `cargo build`/`cargo
# build --release` (both binaries) are unaffected; turned off by
# `crates/cinnabar-wasm`, which depends on this crate with
# `default-features = false` to keep `inkwell`/LLVM out of a wasm32 build
# entirely — the front end through borrow-checking has no such dependency.
codegen = ["dep:inkwell"]
static-musl = []
test-profile-balanced = []
test-profile-smoke = []

[dependencies]
ariadne = "0.6.0"
clap = "4.6.5"
inkwell = { version = "0.10.0", features = ["llvm21-1"], optional = true }
lsp-server = "0.10.0"
serde_json = "1.0.151"

[lints.rust]
warnings = "deny"
dead_code = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
non_camel_case_types = "deny"
unused_variables = "deny"
unused_imports = "forbid"
unused_must_use = "forbid"
unreachable_patterns = "forbid"
unreachable_pub = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
match_wild_err_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
ignored_unit_patterns = "deny"

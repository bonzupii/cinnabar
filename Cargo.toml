[package]
name = "cinnabar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
ariadne = "0.6.0"
chumsky = "0.13.0"
clap = { version = "4.6.5", features = ["derive"] }
ena = "0.14.4"
indexmap = "2.14.0"
inkwell = { version = "0.9.0", features = ["llvm21-1"] }
postcard = "1.1.3"
serde = "1.0.229"
smallvec = "1.15.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

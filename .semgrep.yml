# Cinnabar correctness policy for Rust implementation code.
#
# Cargo.toml owns routine rustc/Clippy lint enforcement: unwrap/expect,
# panic/todo/unimplemented/unreachable, indexing, naming, ordinary unused
# variables/imports, wildcard enum matches, and redundant struct-rest patterns.
# These rules enforce the additional invariants that keep an AI implementation
# from compiling guessed semantics, hiding discarded values, or introducing
# hardcoded string-matching shortcuts and fixture-overfitted fallbacks.
#
# Every finding is an error. Existing findings are refactoring work. There are
# no exceptions for `_`, `_prefix`, `_ =>`, `..`, or `rest @ ..` in Rust.
# `rest @ ..` is Cinnabar source syntax only; it is not a Rust implementation
# escape hatch.
rules:
  - id: cinnabar-no-underscore-prefixed-binding
    languages: [rust]
    severity: ERROR
    message: >-
      Do not hide a value from Rust's unused-variable lint with `_` or an
      `_prefix` name. Bind every produced value with a real name and use it,
      or reshape the producer so the value is not produced. This covers let
      bindings, destructuring patterns, function and closure parameters,
      and for loops.
    pattern-either:
      - pattern-regex: >-
          (?m)^[ \t]*(?:else[ \t]+)?(?:if[ \t]+|while[ \t]+)?let[ \t]+(?:mut[ \t]+)?[^=\n]*\b_[A-Za-z0-9_]+[^=\n]*=
      - pattern-regex: >-
          (?m)^[ \t]*for[ \t]+_[A-Za-z0-9_]+[ \t]+in\b
      - pattern-regex: >-
          (?m)^[ \t]*(?:const|static)[ \t]+_[A-Za-z0-9_]+[ \t]*:
      - pattern-regex: >-
          (?m)^[ \t]*(?:pub[ \t]+)?(?:\([^)\n]*\)[ \t]+)?fn[ \t]+[A-Za-z_][A-Za-z0-9_]*[^\n]*\b_[A-Za-z0-9_]+[ \t]*:
      - pattern-regex: >-
          (?m)^[ \t]*_[A-Za-z0-9_]+[ \t]*:
      - pattern-regex: >-
          (?m)(?:=|\(|,|\bmove)[ \t]*\|[ \t]*_[A-Za-z0-9_]+
      - pattern-regex: >-
          (?m)(?:=|\(|,|\bmove)[ \t]*\|[^|\n]*,[ \t]*_[A-Za-z0-9_]+(?=[^|\n]*\|)

  - id: cinnabar-no-explicit-discard-binding
    languages: [rust]
    severity: ERROR
    message: >-
      This code discards a value with a bare `_`. Name the value and use it
      in program behavior, or restructure the producer so it is not created.
      This covers let bindings, destructuring positions, function and
      closure parameters, and for loops.
    pattern-either:
      - pattern-regex: >-
          (?m)^[ \t]*(?:else[ \t]+)?(?:if[ \t]+|while[ \t]+)?let[ \t]+(?:mut[ \t]+)?[^=\n]*(?<![\w$'])_(?!\w)[^=\n]*=
      - pattern-regex: >-
          (?m)^[ \t]*for[ \t]+_[ \t]+in\b
      - pattern-regex: >-
          (?m)^[ \t]*(?:const|static)[ \t]+_[ \t]*:
      - pattern-regex: >-
          (?m)^[ \t]*_[ \t]*:
      - pattern-regex: >-
          (?m)^[ \t]*_[ \t]*[,)\]]
      - pattern-regex: >-
          (?m)^[ \t]*(?:pub[ \t]+)?(?:\([^)\n]*\)[ \t]+)?fn[ \t]+[A-Za-z_][A-Za-z0-9_]*[^\n]*(?<![\w$'])_(?!\w)[ \t]*:
      - pattern-regex: >-
          (?m)(?:=|\(|,|\bmove)[ \t]*\|[ \t]*_(?!\w)
      - pattern-regex: >-
          (?m)(?:=|\(|,|\bmove)[ \t]*\|[^|\n]*,(?<![\w$'])_(?!\w)(?=[^|\n]*\|)

  - id: cinnabar-no-wildcard-match-arm
    languages: [rust]
    severity: ERROR
    message: >-
      This match arm discards unmatched variants or values with `_`. Name
      every variant explicitly and handle its value, including a `_` nested
      inside a tuple, variant, slice, or or-pattern.
    pattern-regex: >-
      (?m)^[ \t]*[^\n=]*(?<![\w$])_(?!\w)[^\n=]*=>

  - id: cinnabar-no-struct-rest-pattern
    languages: [rust]
    severity: ERROR
    message: >-
      This Rust pattern discards fields with `..`. Bind every field by name
      and use each value, or split the match into explicit arms.
    pattern-regex: >-
      (?m)^[ \t]*(?:[A-Za-z_][A-Za-z0-9_]*::)*[A-Za-z_][A-Za-z0-9_]*[ \t]*\{[^{}\n]*\.\.[^{}\n]*\}[ \t]*(?:=>|=|if|\)|;|$)

  - id: cinnabar-no-slice-rest-pattern
    languages: [rust]
    severity: ERROR
    message: >-
      This Rust slice pattern discards elements with `..`. Bind the remaining
      elements explicitly and use them.
    pattern-regex: >-
      (?m)^[ \t]*(?:\[[^\]\n]*\.\.[^\]\n]*\][ \t]*=>|(?:let|if[ \t]+let|while[ \t]+let)[ \t]+(?:mut[ \t]+)?\[[^\]\n]*\.\.[^\]\n]*\][ \t]*=)

  - id: cinnabar-no-allow-attribute
    languages: [rust]
    severity: ERROR
    message: >-
      Remove this #[allow] attribute and fix the diagnostic it suppresses.
      Lint suppression cannot replace a correct implementation.
    pattern-regex: >-
      (?m)^[ \t]*#!?[ \t]*\[[ \t]*allow[ \t]*\(

  - id: cinnabar-no-fabricated-span
    languages: [rust]
    severity: ERROR
    message: >-
      This creates a fabricated source location. Thread the real Cinnabar
      span through the operation instead of assigning line 1, column 1 or dummy spans.
    pattern-regex: >-
      (?m)(?:crate::lexer::)?Span::new\([ \t]*0[ \t]*,[ \t]*0[ \t]*,[ \t]*1[ \t]*,[ \t]*1[ \t]*\)

  - id: cinnabar-no-fake-consumption-pointer-probe
    languages: [rust]
    severity: ERROR
    message: >-
      This consumes a value only by probing its address. Use the value in real
      control flow or output, or remove it from the producer.
    pattern-either:
      - pattern: |
          let $PTR = $VALUE as *const $TYPE;
          let $ADDR = $PTR as usize;
          if $ADDR == 0 { ... }
      - pattern: |
          let $PTR = $VALUE as *mut $TYPE;
          let $ADDR = $PTR as usize;
          if $ADDR == 0 { ... }
      - pattern: |
          let $ADDR = ($VALUE as *const $TYPE) as usize;
          if $ADDR == 0 { ... }
      - pattern: |
          let $ADDR = ($VALUE as *mut $TYPE) as usize;
          if $ADDR == 0 { ... }
      - pattern: |
          let $PTR = $VALUE as *const $TYPE;
          if $PTR.is_null() { ... }
      - pattern: |
          let $PTR = $VALUE as *mut $TYPE;
          if $PTR.is_null() { ... }

  - id: cinnabar-no-fake-consumption-noop-helper
    languages: [rust]
    severity: ERROR
    message: >-
      This helper only makes an otherwise-unused value appear used. Make the
      value affect real control flow or output, or remove the producer.
    pattern-regex: >-
      (?ms)^[ \t]*(?:pub[ \t]+)?fn[ \t]+(?:touch|use_ref|use_value|consume_ref|consume_value)[ \t]*\([^)]*\)[^{]*\{[^{}]*(?:as[ \t]*\*[ \t]*(?:const|mut)|is_null\(\)|as[ \t]+usize)[^{}]*\}

  - id: cinnabar-no-hardcoded-linearity-string-list
    languages: [rust]
    severity: ERROR
    paths:
      include: ["/src/typecheck.rs", "/src/borrow.rs"]
    message: >-
      Linearity is being derived by matching against a hardcoded string array of handle names.
      Treat all TYD_NATIVE types as linear by default instead of matching hardcoded type names.
    pattern-regex: >-
      (?m)^[ \t]*(?:const|let)[ \t]+LINEAR_HANDLES[ \t]*:[ \t]*\[[^\n]*\][ \t]*=

  - id: cinnabar-no-hardcoded-native-type-checks-in-codegen
    languages: [rust]
    severity: ERROR
    paths:
      include: ["/src/codegen/types.rs", "/src/codegen/emitter.rs"]
    message: >-
      Codegen is checking native surface names against a hardcoded string list.
      Lower all TYD_NATIVE keys to an opaque handle structure { ptr, i64, i64 } by default.
    pattern-regex: >-
      (?m)^[ \t]*if[ \t]+surface[ \t]*==[ \t]*"(?:Block|Vec|String|HashMap)"

  - id: cinnabar-no-hardcoded-generic-parameter-names
    languages: [rust]
    severity: ERROR
    message: >-
      Generic inference is restricted to hardcoded parameter names ("T", "K", "V", "E"). Use the
      function or type declaration's generic-parameter list instead.
    pattern-regex: >-
      (?m)^[ \t]*if[ \t]+name[ \t]*==[ \t]*"T"[ \t]*\|\|[ \t]*name[ \t]*==[ \t]*"K"[ \t]*\|\|[ \t]*name[ \t]*==[ \t]*"V"[ \t]*\|\|[ \t]*name[ \t]*==[ \t]*"E"[ \t]*\|\|[ \t]*name[ \t]*==[ \t]*"U"

  - id: cinnabar-no-native-keyword-alias
    languages: [rust]
    severity: ERROR
    paths:
      include: ["/src/parser.rs", "/src/lexer.rs"]
    message: >-
      The parser is accepting 'native' as a fallback keyword alias. Only 'nat' is valid
      Cinnabar grammar per MANIFESTO.md.
    pattern-regex: >-
      (?m)is_name\([^,\n]*,[^\n]*,[ \t]*"native"\)

  - id: cinnabar-no-fixed-count-fixpoint-loop-caps
    languages: [rust]
    severity: ERROR
    paths:
      include: ["/src/borrow.rs", "/src/typecheck.rs"]
    message: >-
      Fixpoint dataflow loops are capped at a fixed integer constant (32 or 64) without error reporting.
      Derive loop caps dynamically from CFG topology and emit an explicit internal error on non-convergence.
    pattern-regex: >-
      (?m)^[ \t]*if[ \t]+guard[ \t]*>[ \t]*(?:32|64|128)[ \t]*\{[ \t\n]*break;

  - id: cinnabar-no-legacy-string-variant-tag-lookups
    languages: [rust]
    severity: ERROR
    paths:
      include: ["/src/codegen/emitter.rs"]
    message: >-
      Codegen is scanning variant lists by string comparison. Query variant tags directly
      via NODE_VARFACT or pre-interned Protocol name IDs.
    pattern-regex: >-
      (?m)^[ \t]*fn[ \t]+variant_index_by_name(?:_opt)?\b

  - id: cinnabar-no-hand-maintained-variant-tags
    languages: [rust]
    severity: ERROR
    message: >-
      This table is a second source of enum tags. Derive tags from each enum's
      declared variant order and reuse that result for construction and match.
    pattern-regex: >-
      (?m)^[ \t]*self\.[A-Za-z_][A-Za-z0-9_]*tags?\.insert\([ \t]*[^\n]*\.to_string\(\)[ \t]*,

  - id: cinnabar-no-codegen-reinference
    languages: [rust]
    severity: ERROR
    paths:
      exclude: ["/src/resolver.rs", "/src/typecheck.rs"]
    message: >-
      Codegen is recomputing a semantic fact. Consume the resolver or
      typechecker result attached to the source node instead.
    pattern-regex: >-
      (?m)^[ \t]*(?:fn[ \t]+(?:resolve|qualify|infer)[A-Za-z_0-9]*[ \t]*\(|self\.(?:resolve|qualify|infer)[A-Za-z_0-9]*[ \t]*\()

  - id: cinnabar-no-codegen-variant-tag-registration
    languages: [rust]
    severity: ERROR
    message: >-
      Codegen is rebuilding enum tags in a second registry. Derive each tag
      from its enum declaration and carry that result into lowering.
    pattern-regex: >-
      (?m)^[ \t]*(?:fn[ \t]+[A-Za-z_][A-Za-z0-9_]*(?:register|assign)[A-Za-z0-9_]*(?:variant|tag)[A-Za-z0-9_]*[ \t]*\(|(?:self\.)?[A-Za-z_][A-Za-z0-9_]*(?:variant|tag)[A-Za-z0-9_]*[ \t]*=[^=])

  - id: cinnabar-no-invented-fallback-type
    languages: [rust]
    severity: ERROR
    message: >-
      This expression receives an invented fallback type. Use the declared or
      inferred type, or return a typed error when no type can be established.
    pattern-either:
      - pattern-regex: >-
          (?m)^[ \t]*(?:Type::Named\("RangeError"\.to_string\(\)|Type::Generic\("Option"\.to_string\(\),[^\n]*dummy_span|Type::Generic\("Result"\.to_string\(\),[^\n]*dummy_span)

  - id: cinnabar-no-codegen-match-sequential-arms
    languages: [rust]
    severity: ERROR
    message: >-
      Match lowering emits arms sequentially and overwrites one result. Test
      the scrutinee, branch to one matching arm, and join the arm results.
    pattern-regex: >-
      (?m)^[ \t]*res_val[ \t]*=[ \t]*self\.emit_expr\(body_expr\)\?;

  - id: cinnabar-no-codegen-zero-pattern-bindings
    languages: [rust]
    severity: ERROR
    message: >-
      This pattern binding is initialized with zero instead of the matched
      payload. Extract and store the value selected by the pattern.
    pattern-regex: >-
      (?ms)fn[ \t]+bind_pattern_vars[^{]*\{.*?build_store\(alloca,[ \t]*i64_ty\.const_zero\(\)\)

  - id: cinnabar-no-codegen-type-reinference-helper
    languages: [rust]
    severity: ERROR
    message: >-
      Codegen defines a second type-resolution path. Consume the type attached
      by the typechecker instead.
    pattern-regex: >-
      (?m)^[ \t]*fn[ \t]+(?:infer_expr_type|resolve_type)[ \t]*\(

  - id: cinnabar-no-unknown-call-type-fallback
    languages: [rust]
    severity: ERROR
    message: >-
      An unresolved call is being assigned a fallback return type. Report the
      unknown callee at its source span instead.
    pattern-regex: >-
      (?ms)if[ \t]+let[ \t]+Some\(exp_ty\)[ \t]*=[ \t]*expected_type[ \t]*\{.*?Ok\(exp_ty\.clone\(\)\).*?else[ \t]*\{.*?Ok\([^\n]*Unit[^\n]*\)

  - id: cinnabar-no-unknown-field-type-fallback
    languages: [rust]
    severity: ERROR
    message: >-
      An unknown field is being assigned Int as a fallback type. Report the
      missing field at the field-access span instead.
    pattern-regex: >-
      (?ms)Expr::FieldAccess\(target,[ \t]*field_name\)[^\n]*=>.*?Ok\(Type::Named\("Int"\.to_string\(\)\)\)

  - id: cinnabar-no-vec-string-path-joining
    languages: [rust]
    severity: ERROR
    paths:
      include: ["/src/resolver.rs"]
    message: >-
      The resolver is converting prefix lists back into temporary Vec<String> arrays to join with '.'.
      Construct the dotted name string directly in a single reusable buffer.
    pattern-regex: >-
      (?m)parts\.join\([ \t]*"\."[ \t]*\)

  - id: cinnabar-no-generic-with-extension-stripping
    languages: [rust]
    severity: ERROR
    paths:
      include: ["/src/main.rs"]
    message: >-
      The compiler driver is using generic with_extension(""). Use explicit .strip_suffix(".cnb")
      to format the output binary path truthfully.
    pattern-regex: >-
      (?m)\.with_extension\([ \t]*""[ \t]*\)

  - id: cinnabar-no-eprintln-error-leak-in-pipeline
    languages: [rust]
    severity: ERROR
    paths:
      exclude: ["/src/main.rs", "/build.rs"]
    message: >-
      A compiler pipeline stage is writing directly to stderr/stdout with
      eprintln! or println!. Push a typed diagnostic with a real span to the
      errors vector instead so it can be rendered through Ariadne.
    pattern-regex: >-
      (?m)^[ \t]*(?:eprintln!|println!)\([ \t]*"

  - id: cinnabar-no-unformatted-plain-text-error-dump
    languages: [rust]
    severity: ERROR
    message: >-
      This error string is being dumped directly as plain text to stderr. Every
      diagnostic must be collected into the typed Diag vector or CodegenError
      model for Ariadne formatting.
    pattern-regex: >-
      (?m)^[ \t]*eprintln!\([ \t]*"(?:error:|duplicate symbol|cannot redeclare|failed to render)

  - id: cinnabar-no-codegen-dummy-span-error
    languages: [rust]
    severity: ERROR
    paths:
      include: ["/src/codegen/"]
    message: >-
      Codegen is creating a builder_error with a hardcoded (-1, 0, 0) dummy span.
      Pass the real source span (file, start, end) of the AST node, item, or
      entry file being emitted so Ariadne can render a source-highlighted diagnostic.
    pattern-regex: >-
      (?m)builder_error\([ \t]*(?:-1|NO_FILE)[ \t]*,[ \t]*0[ \t]*,[ \t]*0[ \t]*,

  - id: cinnabar-no-codegen-dummy-span-error
    languages: [rust]
    severity: ERROR
    paths:
      include: ["/src/codegen/"]
    message: >-
      Codegen is creating a builder_error with a hardcoded -1/NO_FILE dummy span.
      Pass the real source span (file, start, end) of the AST node being emitted.
    pattern-either:
      - pattern: builder_error(-1, $START, $END, $MSG)
      - pattern: builder_error(NO_FILE, $START, $END, $MSG)
      - pattern: |
          let $F = -1;
          ...
          builder_error($F, $START, $END, $MSG)

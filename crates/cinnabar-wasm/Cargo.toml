[package]
name = "cinnabar-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` is load-bearing: it drops the `codegen` feature
# and, with it, the `inkwell`/LLVM dependency, which is the one part of the
# pipeline that cannot target wasm32. Everything this crate calls
# (module_loader::load_with_overlay through analysis::analyze) is pure
# computation over the shared node arena.
cinnabar = { path = "../..", default-features = false }
serde_json = "1.0.151"
wasm-bindgen = "0.2"

[lints.rust]
warnings = "deny"
dead_code = "deny"
unused_imports = "forbid"
